name: publish-shared
on:
  push:
    tags: ['shared-v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@senior-project-2026-09'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senior-project-2026-09/shared build
      - run: pnpm --filter @senior-project-2026-09/shared publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
